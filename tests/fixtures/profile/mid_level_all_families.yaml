# The role catalog's rules with every family picked at the mid level (test_profile_builder.py).
# A change to a pattern, weight, exclude or level preset in core/roles.py changes what a new
# install gets, so it has to change here too, on purpose.
title:
  include:
  - pattern: \bmachine learning\b
    weight: 1.0
  - pattern: \b(ai|ml)\b
    weight: 1.0
  - pattern: \bcomputer vision\b|\bperception\b
    weight: 1.0
  - pattern: \bllm\b|\bmlops\b
    weight: 0.9
  - pattern: \bforward[- ]deployed\b
    weight: 0.9
  - pattern: \bsoftware (engineer|developer|development|dev engineer)|\bsdes?\b|\bsde
      ?(i{1,3}|[1-3])\b|\bengineer( (i{1,3}|[1-3]))?\W+software\b
    weight: 0.9
  - pattern: \bback[- ]?end\b
    weight: 0.9
  - pattern: \bfull[- ]?stack\b
    weight: 0.9
  - pattern: \bfront[- ]?end\b|\bweb (developer|engineer)\b|\bui engineer\b
    weight: 0.8
  - pattern: \b(python|java|javascript|typescript|react|node(\.?js)?)\s+(developer|engineer)\b
    weight: 0.8
  - pattern: \bfounding (\w+ )?engineer\b|\bproduct engineer\b
    weight: 0.8
  - pattern: \bapplications? developer\b
    weight: 0.7
  - pattern: \bmobile (developer|engineer)\b|\breact native\b|\bflutter\b
    weight: 0.6
  - pattern: \bdev(sec)?ops\b|\bsite reliability\b|\bsre\b|\bcloud engineer\b
    weight: 0.6
  - pattern: \bdata (platform |infrastructure |integration |pipelines? |warehouse
      )?engineer|\betl\b|\banalytics engineer\b
    weight: 0.6
  - pattern: \bapi\b|\bplatform\b
    weight: 0.6
  - pattern: \bsolutions engineer\b
    weight: 0.5
  exclude:
  - \bmanager\b
  - \bintern(ship)?\b
  - \bsales\b
  - \brecruit
  - \bdirector\b|\bhead of\b
  - \bresearch scientist\b|\bphd\b
  - \b(hardware|firmware|asic|fpga)\b
level:
  include:
  - entry-level
  - \bii\b
  - \bmid[- ]level\b
  exclude:
  - \bstaff\b
  - \bprincipal\b
  - \bnew[- ]?grad\b
  include_bonus: 0.2
description:
  max_years_experience: 5
  years_mode: exclude
countries:
- US
