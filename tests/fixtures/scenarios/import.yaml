# Preferences and watchlist for the recorded scenarios (first_poll, second_poll), in the shape
# of a config.yaml from before M6: `jobpulse profile import` brings them into the database.
# Try it (config.yaml beside this file holds the infrastructure):
#   export DATABASE_URL=sqlite:////tmp/jobpulse-demo.db
#   uv run jobpulse --config tests/fixtures/scenarios/config.yaml db upgrade
#   uv run jobpulse --config tests/fixtures/scenarios/config.yaml profile import tests/fixtures/scenarios/import.yaml
#   uv run jobpulse --config tests/fixtures/scenarios/config.yaml poll --once --dry-run \
#     --fixtures tests/fixtures/scenarios/first_poll
contact_email: dev@example.com
notify: {channels: []}
filters:
  title:
    include: ['\bbackend\b']
watchlist:
  - {name: Acme, ats: greenhouse, token: acme, priority: 5}
  - {name: Beta, ats: lever, token: beta}
  - {name: Gamma, ats: ashby, token: gamma}
searches:
  - {name: backend-sf, site: linkedin, search_term: backend engineer, location: "San Francisco, CA"}
