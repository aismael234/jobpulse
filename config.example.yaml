# jobpulse infrastructure. Copy to config.yaml (gitignored) and edit, or run without one: every
# key has a default. Your preferences (filters, scoring, notifications, searches, blocklist) live
# in the database: edit them on the dashboard's Settings page (profile.example.yaml shows them
# all). Secrets (ntfy topic, Discord webhook, dashboard password, API keys) go in .env or on
# Settings, never here.

# DATABASE_URL in .env overrides this. SQLite runs in WAL mode.
database_url: sqlite:///data/jobpulse.db

http:
  timeout_seconds: 20
  max_attempts: 4               # per request, with exponential backoff and full jitter
  host_limits:                  # concurrent requests per host; unlisted hosts get 2
    boards-api.greenhouse.io: 4
    api.lever.co: 4
    api.eu.lever.co: 4
    api.ashbyhq.com: 4
    raw.githubusercontent.com: 1
    www.linkedin.com: 1

schedules:
  watchlist: {every_minutes: 30, jitter_seconds: 120}
  simplify: {every_minutes: 30, jitter_seconds: 120}     # the feed changes about every 30 min
  job_boards: {every_minutes: 75, jitter_seconds: 900}   # 60–90 min; searches ask for the last 3 h

detection:
  freshness_hours: 48           # notify only for postings younger than this
  closure_missing_polls: 2      # complete polls a job must be missing from before it closes
  fingerprint_window_days: 30   # how far back a company+title+location match merges

linkedin:
  delay_min_seconds: 4          # pause between LinkedIn requests, chosen at random in this range
  delay_max_seconds: 8
  cooldown_minutes: 30          # after a 429, LinkedIn searches and job pages wait this long
  job_pages: true               # read each new LinkedIn match's public page: description, applicant count
  max_job_pages_per_hour: 40
  job_page_wait_hours: 12       # a match whose page couldn't be read (cap, cool-down) stays undecided
                                # and is tried again next cycle, for up to this long; then it's judged
                                # without the page. 0 judges it at once; must be under freshness_hours

# Workday boards: a search reads pages of 20 jobs (Workday's own limit), at most this many pages.
workday:
  max_pages: 25

# The SimplifyJobs New-Grad list. Each fetch sends the stored ETag, so an unchanged feed costs
# one tiny request. Its first successful fetch is a silent baseline.
simplify:
  enabled: true
  url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json

# Greenhouse, Lever and Ashby boards linked from the feed or from job-board postings are
# checked with one API call and added to the watchlist (source auto, priority 0). A new
# board's first poll is a silent baseline. Boards already on the watchlist, paused ones included,
# are never added again.
discovery:
  enabled: true
  require_match: true           # only boards with a posting that passes your title and location filters
  max_board_jobs: 1000          # skip boards with more open jobs (add them to the watchlist yourself); null = no limit
  max_auto_companies: 50        # stop adding once this many discovered companies are polled; null = no limit
  max_validations_per_cycle: 10
  max_page_fetches_per_cycle: 5 # gh_jid links on company sites: the page is read once for the board

# One push when a source keeps failing or a busy one goes quiet, and one more when it recovers.
health:
  enabled: true
  consecutive_failures: 3
  busy_min: 5                   # "busy": a 7-day median of at least this many postings per run
  busy_window_days: 7
  zero_hours: 24                # only empty successful runs for this long: suspicious

# A source whose API redirects to a maintenance page (Workday does, for every tenant at once) is
# retried this many times, this far apart, and then paused as a whole: its boards are skipped
# until the cool-down ends. One health message says it's down, and one says when it's back.
maintenance:
  retries: 2
  retry_delay_seconds: 30
  cooldown_minutes: 30

# How long the run history (one row per fetch of a board, feed or search) is kept for the Health
# page and the health rules. Pruned once a day; must cover health.busy_window_days.
retention:
  runs_days: 30                 # null keeps every run

# `jobpulse web`. Basic auth turns on when DASHBOARD_USER and DASHBOARD_PASSWORD are set in .env.
dashboard:
  host: 127.0.0.1               # keep it local; reach it from your phone through Tailscale
  port: 8000

# Resume similarity: `jobpulse resume set FILE` stores your resume, and postings with a
# description are scored by how close they are to it (scoring.weights.resume) in place of the
# stack keywords. It runs locally (bge-small-en-v1.5, 64 MB, about 200 MB of memory while in
# use); `jobpulse embeddings download` fetches the model once, nothing else downloads it.
embeddings:
  enabled: true                 # false on small hosts: the stack keywords stay
  cache_dir: data/models        # relative to where jobpulse runs

# The public board seed: with `remote` on, a watchlist cycle fetches it once a day (with its
# ETag) and adds the boards you lack, each validated once; their first poll is silent.
# `jobpulse companies seed apply` adds the seed that ships with jobpulse.
seed:
  remote: false                 # off until the repository is public
  url: https://raw.githubusercontent.com/aismael234/jobpulse/main/src/jobpulse/data/seed/boards.json
  max_bytes: 2000000            # a bigger file applies nothing
  max_new_boards: 100           # validated per sync; the rest wait for the next day
