# jobpulse configuration. Copy to config.yaml (gitignored) and edit.
# Secrets (ntfy topic, Discord webhook, dashboard password, API keys) go in .env, never here.

# Sent in the User-Agent to the ATS APIs so their operators can reach you.
contact_email: you@example.com

# Used for digest times and display. Storage is always UTC.
timezone: America/Los_Angeles

# DATABASE_URL in .env overrides this. SQLite runs in WAL mode.
database_url: sqlite:///data/jobpulse.db

http:
  timeout_seconds: 20
  max_attempts: 4               # per request, with exponential backoff and full jitter
  host_limits:                  # concurrent requests per host; unlisted hosts get 2
    boards-api.greenhouse.io: 4
    api.lever.co: 4
    api.eu.lever.co: 4
    api.ashbyhq.com: 4
    raw.githubusercontent.com: 1
    www.linkedin.com: 1

schedules:
  watchlist: {every_minutes: 30, jitter_seconds: 120}
  simplify: {every_minutes: 30, jitter_seconds: 120}     # the feed changes about every 30 min
  job_boards: {every_minutes: 75, jitter_seconds: 900}   # 60–90 min; searches ask for the last 3 h
  digest_times: ["09:00", "18:00"]                       # in `timezone`; [] turns the digest off

detection:
  freshness_hours: 48           # notify only for postings younger than this
  closure_missing_polls: 2      # complete polls a job must be missing from before it closes
  fingerprint_window_days: 30   # how far back a company+title+location match merges

filters:
  title:
    include:                    # at least one must match; the weight feeds the title score
      - {pattern: '\bback[- ]?end\b', weight: 1.0}
      - {pattern: '\bplatform\b', weight: 0.8}
      - {pattern: '\binfrastructure\b', weight: 0.8}
      - {pattern: '\bapi\b', weight: 0.7}
      - {pattern: '\bsoftware engineer\b', weight: 0.6}
    exclude:                    # any match rejects the posting
      - '\bmanager\b'
      - '\bintern(ship)?\b'
      - '\bfront[- ]?end\b'
      - '\bsales\b'
      - '\brecruit'
  level:
    include: ["<SET ME>"]       # level words you want, e.g. 'senior' or '\bii\b'; a title match adds a bonus
    exclude: ['\bstaff\b', '\bprincipal\b']   # EXAMPLE ONLY; a title match rejects the posting
  description:
    max_years_experience: null  # e.g. 5; null turns the check off
    years_mode: penalize        # penalize (drops to the digest) or exclude
    level_phrases_exclude: []   # e.g. 'staff-level'
    stack_keywords:             # regex: weight, matched against the description
      '\bpython\b': 1.0
      '\bgo(lang)?\b': 1.0
      '\bpostgres(ql)?\b': 0.5
      '\bkubernetes\b': 0.5
  locations:
    include: []                 # regexes over normalized labels, e.g. '^Remote \(US\)$'; empty = anywhere
    exclude: []
    aliases:                    # your abbreviations, on top of the built-in table
      SF: San Francisco, CA
      NYC: New York, NY
    unknown_location_passes: true

scoring:
  weights:
    freshness: 0.25
    company_priority: 0.20
    title: 0.30
    stack: 0.25
    level_mismatch: 0.50        # subtracted
    applicants: 0.10            # only when known
  priority_cap: 10              # watchlist priority is scaled to 0..1 against this
  instant_threshold: 0.55       # at or above: instant push; below (but passing filters): digest

notify:
  channels: [ntfy]              # ntfy and/or discord; their secrets go in .env
  ntfy:
    base_url: https://ntfy.sh   # or your self-hosted server
    priority: 4
    tags: [briefcase]
  max_instant_per_cycle: 10     # the rest go to the digest with one "N more" push
  dashboard_url: null           # how your phone reaches the dashboard (e.g. your Tailscale
                                # https://<machine>.<tailnet>.ts.net/); digests link to it

# EXAMPLES: replace with the companies you care about. Tokens verified on 2026-10-23.
# Greenhouse: job-boards.greenhouse.io/<token> · Lever: jobs.lever.co/<token>
# (region: eu for jobs.eu.lever.co) · Ashby: jobs.ashbyhq.com/<token>
watchlist:
  - {name: Stripe, ats: greenhouse, token: stripe, priority: 5}
  - {name: Discord, ats: greenhouse, token: discord, priority: 3}
  - {name: Figma, ats: greenhouse, token: figma, priority: 3}
  - {name: GitLab, ats: greenhouse, token: gitlab, priority: 2}
  - {name: Cloudflare, ats: greenhouse, token: cloudflare, priority: 3}
  - {name: Spotify, ats: lever, token: spotify, priority: 2}
  - {name: Zoox, ats: lever, token: zoox, priority: 1}
  - {name: Palantir, ats: lever, token: palantir, priority: 2}
  - {name: Linear, ats: ashby, token: linear, priority: 4}
  - {name: Ramp, ats: ashby, token: ramp, priority: 4}
  - {name: Supabase, ats: ashby, token: supabase, priority: 3}

# Indeed and LinkedIn searches through JobSpy. Each asks for jobs posted in the last
# hours_old (3) hours on every run, so a late or failed run leaves no gap. The first run of a
# new (or changed) search is a silent baseline. LinkedIn ignores is_remote; put "Remote" in
# the location instead. Keep LinkedIn searches few and results_wanted low.
searches: []
#  - {name: backend-us-remote, site: indeed, search_term: "backend engineer", location: "United States", is_remote: true}
#  - {name: backend-sf, site: linkedin, search_term: "backend engineer", location: "San Francisco, CA", results_wanted: 25}

linkedin:
  delay_min_seconds: 4          # pause between LinkedIn requests, chosen at random in this range
  delay_max_seconds: 8
  cooldown_minutes: 30          # after a 429, LinkedIn searches wait this long

# The SimplifyJobs New-Grad list. Each fetch sends the stored ETag, so an unchanged feed costs
# one tiny request. Its first successful fetch is a silent baseline.
simplify:
  enabled: true
  url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json

# Greenhouse, Lever and Ashby boards linked from the feed or from job-board postings are
# checked with one API call and added to the watchlist (source auto, priority 0). A new
# board's first poll is a silent baseline. Boards you removed from config are never re-added.
discovery:
  enabled: true
  require_match: true           # only boards with a posting that passes your title and location filters
  max_board_jobs: 1000          # skip boards with more open jobs (add them to the watchlist yourself); null = no limit
  max_auto_companies: 50        # stop adding once this many discovered companies are polled; null = no limit
  max_validations_per_cycle: 10
  max_page_fetches_per_cycle: 5 # gh_jid links on company sites: the page is read once for the board

# Companies and boards to stay away from. A blocked company's postings (from any source) are
# stored but never pushed or put in a digest, discovery never adds its boards, and a board it
# added earlier is no longer polled. Names match whole, ignoring case, punctuation and
# Inc/LLC/Ltd: "Acme, Inc." blocks "ACME" but not "Acme Widgets". Blocked boards (ats/token)
# are never added or polled, though their jobs can still reach you through the feed or a
# search. To drop a company from the watchlist above, remove it there instead.
blocklist:
  companies: []                 # e.g. [Jobot, Revature]
  boards: []                    # e.g. [greenhouse/spacex]

# One push when a source keeps failing or a busy one goes quiet, and one more when it recovers.
health:
  enabled: true
  consecutive_failures: 3
  busy_min: 5                   # "busy": a 7-day median of at least this many postings per run
  busy_window_days: 7
  zero_hours: 24                # only empty successful runs for this long: suspicious

# `jobpulse web`. Basic auth turns on when DASHBOARD_USER and DASHBOARD_PASSWORD are set in .env.
dashboard:
  host: 127.0.0.1               # keep it local; reach it from your phone through Tailscale
  port: 8000
