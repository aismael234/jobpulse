# Alembic configuration. The database URL is not set here: jobpulse passes it in code, and the
# `alembic` command uses ./data/jobpulse.db (migrations/env.py), the app's default.
# The scripts ship inside the package (jobpulse/migrations); `jobpulse db upgrade` doesn't need
# this file, `uv run alembic revision --autogenerate` does.

[alembic]
script_location = jobpulse:migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
